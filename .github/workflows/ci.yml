name: CI

# 回归全靠本地手跑十个脚本 —— 这是最容易出事的一环：
# 任何人改一行 `lookup()` 都可能悄悄破坏官方 frp 互通，而本地未必跑得到。
# 这里把 fmt / clippy / 单测 / 冒烟串成一条流水线，push 和 PR 都拦一次。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # 静态检查：最快失败，别让格式问题占用后面的编译机时
  # ---------------------------------------------------------------
  lint:
    name: fmt / clippy
    runs-on: ubuntu-latest
    # rustsec/audit-check 要通过 Checks API 发布审计结果，需要 checks: write。
    # 一旦声明 job 级 permissions，未列出的权限会归零，所以保留 checkout 需要的 contents: read。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (含测试代码)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 文档生成物漂移检查。
      #
      # NLink 页面的正文同时在三个地方出现：中文内容源 `docs/nlink.md`、
      # 英文内容源 `docs/nlink.en.md`、生成的 `docs/assets/pages.*.js`。
      # 手工维护必然漂移（0.7.6 就出现过英文站显示中文正文）。这一步让
      # 「改了内容源却没重新生成」在 CI 上直接红掉。
      - name: docs generated pages are in sync
        run: python3 scripts/sync_nlink_doc.py --check

      # OpenWrt 发布包命名一致性：install / release.py / release.yml /
      # e2e / README / 下载页里的 linux_* 包名必须完全一致，
      # 且 mipsel 一律写 linux-mipsle（官方的 frp_<ver>_linux_mipsle 也是这么拼的，
      # 直接按 mipsel 直译拼出来的名字是错的）。
      - name: openwrt package naming is consistent
        run: python3 scripts/check-openwrt-naming.py

      # OpenWrt e2e 脚本的纯逻辑单测（不依赖 docker）：RSS 解析、
      # mock procd 记录解析、docker 命令参数拼装。
      - name: openwrt e2e unit tests
        run: |
          python3 -m py_compile scripts/e2e_openwrt.py scripts/test_e2e_openwrt.py
          python3 scripts/test_e2e_openwrt.py

      # 依赖漏洞门禁。
      #
      # v0.5.1 发版时锁的 rustls 0.23.44 带着 RUSTSEC-2026-0285
      # （TLS 1.3 握手消息被跨加密层级错误接受），而当时没有任何环节
      # 会去查 —— 是事后人工跑 cargo audit 才发现的。加这一步是为了
      # **下一次不用靠人想起来**。
      #
      # 用 rustsec/audit-check 而不是裸 `cargo install cargo-audit`：
      # 前者带缓存、失败时会把公告直接写进 job summary。
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # 单元测试：三个 crate + 两个二进制全部跑
  # ---------------------------------------------------------------
  test:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo test
        run: cargo test --workspace --all-targets
        timeout-minutes: 20

  # ---------------------------------------------------------------
  # 交叉编译发布包（只做产物校验，不上传）
  # 提前在 CI 里跑一遍，避免 tag 那天才发现某个目标平台编不过
  # ---------------------------------------------------------------
  cross-build:
    name: cross build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          # OpenWrt arm_cortex-a*_vfp 设备（linux-arm-hf）用这个产物。
          # cross 的官方镜像自带 musl-gcc，ring 的 C 代码能编过。
          - target: armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      # ★ 缓存必须按 target 隔离，否则两个矩阵任务会抢同一个 key。
      # Swatinem/rust-cache 的默认 key 是 `v0-rust-${job}-${os}-...`，
      # 矩阵里的两个 target 共用 `cross-build` 这个 job 名 ⇒ key 完全相同
      # ⇒ x86_64 任务存下来的 `target/release/build/*`（宿主 build script 二进制）
      # 会被 aarch64 任务还原进它那个更老的基础镜像里跑，报
      # `weak version GLIBC_2.28/2.29/2.30 not found` + `gettid` relocation error。
      # 报错在 libc 的 build script 上、跟本项目代码无关，且只有 aarch64 红 —— 
      # 因为 x86_64 的镜像新、aarch64 的镜像老。加 key 后两者互不复用。
      #
      # 再把产物目录也分开（`target-cross`）：cross 会把 target 目录挂进容器，
      # 和宿主 `cargo build` 产出的 build script 混在一起正是上面那个故障的成因。
      # 这个目录只在容器里写过，跨轮复用是安全的。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cross-${{ matrix.target }}
          workspaces: ". -> target-cross"
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cross

      - name: build --release
        env:
          CARGO_TARGET_DIR: target-cross
          CROSS_CONTAINER_OPTS: --platform linux/amd64
        run: cross build --release --workspace --target ${{ matrix.target }}
        timeout-minutes: 30

  # ---------------------------------------------------------------
  # 端到端冒烟：真跑一次 frps + frpc，验证 TCP / HTTP / stcp 转发能用
  # 这是唯一能覆盖"握手协议改坏了"的检查 —— 单测再全也测不到
  # ---------------------------------------------------------------
  smoke:
    name: e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: build binaries
        run: cargo build --release --workspace
        timeout-minutes: 20

      - name: run integration tests
        run: cargo test --workspace --release --test '*'
        timeout-minutes: 10

      # 数据面加密/压缩矩阵（真二进制，不是 mock）。
      #
      # 0.7.6 修的缺陷是「vhost 工作连接按裸流中继、忽略 useEncryption /
      # useCompression」。这条路径的单元测试是内存流对拷，永远能过；
      # 只有真起 frps + frpc + 真后端才能发现「客户端发密文、服务端按明文转发」。
      # 放在冒烟 job 里，release 构建产物直接复用，不额外编译。
      - name: data-plane crypto matrix (http/tcp/udp/https/tcpmux)
        run: |
          # https 用例要自签证书（用 cryptography 生成，不依赖系统 openssl）。
          # 不装的话该用例会被跳过 —— 跳过不等于通过。
          python3 -m pip install --quiet cryptography
          python3 scripts/e2e_vhost_crypto.py --bin-dir target/release
        timeout-minutes: 8

      # SSH 网关数据面（tcp / tcpmux / stcp）。
      # 0.7.7 跑这个才发现：token 认证拿原始 token 去比对 auth_key 派生值，
      # 于是**永远失败**；只测"注册成功"是发现不了的。
      - name: ssh tunnel gateway data plane
        run: python3 scripts/e2e_ssh_gateway.py --bin-dir target/release
        timeout-minutes: 8

      # 真实 OIDC 流程：frps 真的拉 discovery/jwks，frpc 真的发
      # client_credentials 拿 RS256 JWT。0.7.7 由此发现工作连接凭证用错了
      # 形态（派生值 vs 原始 JWT），OIDC 部署下隧道完全不可用。
      - name: oidc end-to-end (real discovery + jwks + RS256)
        run: |
          python3 -m pip install --quiet cryptography
          python3 scripts/e2e_oidc.py --bin-dir target/release
        timeout-minutes: 8

      - name: check --gen-config works and produced config reloads
        run: |
          ./target/release/nfrp-server --gen-config /tmp/frps.toml
          ./target/release/nfrp-client --gen-config /tmp/frpc.toml
          ./target/release/nfrp-server --check -c /tmp/frps.toml
          ./target/release/nfrp-client --print-example > /dev/null

  # ---------------------------------------------------------------
  # OpenWrt MIPS（mips / mipsel，24kc）：Tier 3 目标，没有预编译 std。
  #
  # 为什么单独成 job 且 continue-on-error：
  #   * 这两个目标必须用 nightly + rust-src + -Zbuild-std=std,panic_abort
  #     现编 std；工具链要用 OpenWrt SDK 自带的 24kc 交叉 gcc，
  #     这样 libc 才和路由器一致。
  #   * 64 位原子：项目源码已改 portable-atomic，在 mips32 上走纯 Rust
  #     seq_lock（不链接 libatomic）；依赖树里 tokio/serde/zerocopy 的
  #     std AtomicU64 全部有 cfg(target_has_atomic="64") 门控，pprof 的
  #     perfmaps feature 未开。因此不需要 -C link-arg=-latomic。
  #   * ring 不是阻塞（2026-11-21 翻案）：0.17 的 build.rs 对没命中
  #     ASM_TARGETS 的架构取 asm_target=None、不生成任何汇编也不 panic，
  #     而 sources_for_arch() 会把标着 &[] 的纯 C 源无条件编进去，所以
  #     MIPS 走的是通用 C 回退。实测 run 44556994660 里 `Compiling ring
  #     v0.17.14` 正常结束、整个 workspace 2m00s 编完并产出 MIPS32 ELF。
  #     之前写的"ring 无 C 回退"是错的，它让这个 job 长期被当成必红。
  #   * 真正红过的原因是我们自己的断言：SDK 的 gcc 默认产 PIE 动态链接，
  #     interpreter 是 /lib/ld-musl-mipsel-sf.so.1，而断言只认
  #     statically linked|static-pie ⇒ 判死。OpenWrt 官方软件包本身就是
  #     动态链接 musl，动态才是这里的常规形态。
  #     详见 run/OPENWRT-REPORT.md 第七节与桌面《NFrp MIPS 支持诉求》。
  # ---------------------------------------------------------------
  cross-build-mips:
    name: openwrt-mips ${{ matrix.target }} (best effort)
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # mipsel_24kc：ramips/mt76x8。SDK sha256 取自官方 sha256sums。
          - target: mipsel-unknown-linux-musl
            sdk_url: https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt76x8/openwrt-sdk-23.05.5-ramips-mt76x8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
            sdk_sha: d3fc656e5ecc5099f16379860582c22fd57b9e03a81521b17c9ad31034cde1c0
            gcc_prefix: mipsel-openwrt-linux-musl
            openwrt_arch: mipsel_24kc
          # mips_24kc（大端）：ath79/generic。
          - target: mips-unknown-linux-musl
            sdk_url: https://downloads.openwrt.org/releases/23.05.5/targets/ath79/generic/openwrt-sdk-23.05.5-ath79-generic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
            sdk_sha: dc2ffaf036929630e3de601be2006829d57ed30d018ed4e9e71496bd75d9cbb6
            gcc_prefix: mips-openwrt-linux-musl
            openwrt_arch: mips_24kc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install nightly + rust-src
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: download & verify OpenWrt SDK
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o sdk.tar.xz "${{ matrix.sdk_url }}"
          echo "${{ matrix.sdk_sha }}  sdk.tar.xz" | sha256sum -c -
          mkdir -p sdk
          tar -xJf sdk.tar.xz -C sdk --strip-components=1
          GCC=$(find sdk/staging_dir -type f -name '${{ matrix.gcc_prefix }}-gcc' | head -n1)
          test -n "$GCC" || { echo "SDK 里找不到交叉 gcc"; exit 1; }
          echo "SDK_BIN=$(dirname "$(realpath "$GCC")")" >> "$GITHUB_ENV"
          # SDK 的 gcc 包装脚本靠 STAGING_DIR 找 sysroot，不设会一直
          # 打 `environment variable 'STAGING_DIR' not defined` 警告。
          echo "STAGING_DIR=$PWD/sdk/staging_dir" >> "$GITHUB_ENV"

      - name: build --release (-Zbuild-std)
        env:
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.gcc_prefix }}-gcc
          CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.gcc_prefix }}-gcc
          CC_mipsel_unknown_linux_musl: ${{ matrix.gcc_prefix }}-gcc
          CC_mips_unknown_linux_musl: ${{ matrix.gcc_prefix }}-gcc
          AR_mipsel_unknown_linux_musl: ${{ matrix.gcc_prefix }}-ar
          AR_mips_unknown_linux_musl: ${{ matrix.gcc_prefix }}-ar
          # panic="abort" 已在 profile 里，build-std 只需 std + panic_abort。
          # 不设 -latomic：portable-atomic 在 mips32 用纯 Rust seq_lock，
          # 依赖里的 std 64 位原子均有 cfg 门控，无需链接 libatomic。
        run: |
          set -euo pipefail
          export PATH="$SDK_BIN:$PATH"
          cargo +nightly build --release --workspace \
            -Z build-std=std,panic_abort \
            --target ${{ matrix.target }} \
            -p nfrp-server -p nfrp-client
          D="target/${{ matrix.target }}/release"
          file "$D/nfrp-server" "$D/nfrp-client"
          # 只校验"是 32 位 MIPS ELF 且能被 OpenWrt 的 musl 加载"。
          # 不再强求静态：SDK 的 gcc 默认产 PIE 动态链接，interpreter 是
          # /lib/ld-musl-<arch>-sf.so.1，这正是 OpenWrt 软件包的常态，
          # 而 OpenWrt 系统本身一定带这个 ld.so。之前那条
          # `statically linked|static-pie` 断言把正常产物判成了失败。
          for b in nfrp-server nfrp-client; do
            F=$(file -b "$D/$b")
            echo "$F" | grep -Eq 'ELF 32-bit .*MIPS' \
              || { echo "$b 不是 32 位 MIPS ELF: $F"; exit 1; }
            echo "$F" | grep -Eq 'statically linked|static-pie|interpreter /lib/ld-musl-' \
              || { echo "$b 既不是静态也不是 musl 动态: $F"; exit 1; }
          done

      - name: qemu 冒烟（frps/frpc -v 必须是裸 0.71.0）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-user-static
          QEMU=$(case "${{ matrix.target }}" in
                   mipsel-*) echo qemu-mipsel-static ;;
                   mips-*)   echo qemu-mips-static ;;
                 esac)
          D="target/${{ matrix.target }}/release"
          # 产物是动态链接到 /lib/ld-musl-<arch>-sf.so.1 的（OpenWrt 常态），
          # 所以 qemu 必须用 -L 指到一个真能提供这个 loader 的 sysroot 前缀。
          # toolchain-* 和 target-*/root-* 两种位置都试，找不到就报出来，
          # 不猜也不退化成"跳过"。
          SYSROOT=""
          for cand in sdk/staging_dir/toolchain-*/ sdk/staging_dir/target-*/root-*/; do
            [ -e "$cand" ] || continue
            if ls "$cand"lib/ld-musl-* >/dev/null 2>&1; then
              SYSROOT="$cand"
              break
            fi
          done
          if [ -z "$SYSROOT" ]; then
            echo "SDK 里找不到 ld-musl 加载器，动态链接的产物无法运行" >&2
            find sdk/staging_dir -name 'ld-musl-*' 2>/dev/null | head -n 10 >&2
            exit 1
          fi
          echo "qemu sysroot = $SYSROOT"
          ls -l "$SYSROOT"lib/ld-musl-* | head -n 3
          for b in nfrp-server nfrp-client; do
            V=$("$QEMU" -L "$SYSROOT" "$D/$b" -v)
            echo "$b -v -> [$V]"
            test "$V" = "0.71.0" || { echo "-v 必须输出裸 0.71.0"; exit 1; }
          done

      - name: upload mips artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfrp-linux-${{ matrix.openwrt_arch }}
          path: |
            target/${{ matrix.target }}/release/nfrp-server
            target/${{ matrix.target }}/release/nfrp-client
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------
  # OpenWrt x86_64 官方 rootfs 容器冒烟：
  #   把 musl 版 frps/frpc + init 脚本装进真 rootfs，验证
  #   service 启停 / respawn、一条 tcp 代理端到端、官方 frpc 互通、
  #   以及空闲 RSS。拉不到官方二进制时写明跳过，绝不伪造结果。
  # ---------------------------------------------------------------
  openwrt-smoke:
    name: openwrt x86_64 rootfs smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cross

      - name: build musl binaries
        env:
          CARGO_TARGET_DIR: target-cross
        # 必须用块标量：折行标量会把"反斜杠+换行"折成空格，
        # 传给 cross 的参数变成 " -p"，报 unexpected argument。
        run: |
          cross build --release --workspace --target x86_64-unknown-linux-musl \
            -p nfrp-server -p nfrp-client

      - name: import official OpenWrt rootfs
        env:
          ROOTFS_URL: https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-23.05.5-x86-64-rootfs.tar.gz
          ROOTFS_SHA: 383311300e1fd796f5a39bf09ad87bcedec61a7f09263f79cd1352757a3573a9
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o rootfs.tar.gz "$ROOTFS_URL"
          echo "$ROOTFS_SHA  rootfs.tar.gz" | sha256sum -c -
          docker import rootfs.tar.gz nfrp-openwrt:test
          docker image inspect nfrp-openwrt:test >/dev/null

      - name: shellcheck init scripts (dash/POSIX)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck
          shellcheck --shell=dash openwrt/etc/init.d/frpc openwrt/etc/init.d/frps \
            scripts/install-openwrt.sh

      # 注意：这里必须用 `|` 块标量。写成 `run: cmd \` 的多行 plain scalar 时，
      # YAML 会把换行折叠成空格，行尾的 `\` 于是变成"转义空格"，
      # 参数被拼成 " --bin-dir"（带前导空格），argparse 认不出就报
      # required: --bin-dir。踩过，见 run 44858127381。
      - name: run e2e in rootfs container
        run: |
          python3 scripts/e2e_openwrt.py \
            --bin-dir target-cross/x86_64-unknown-linux-musl/release \
            --rootfs-image nfrp-openwrt:test
        timeout-minutes: 15

      - name: official frpc <-> NFrp frps interop
        # 官方二进制从 GitHub Release 下载；拉不到就明确跳过，不伪造通过。
        run: |
          python3 scripts/e2e_openwrt.py \
            --bin-dir target-cross/x86_64-unknown-linux-musl/release \
            --rootfs-image nfrp-openwrt:test --official-interop-only
        continue-on-error: true
        timeout-minutes: 10
