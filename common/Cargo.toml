[package]
name = "nfrp-common"
description = "NFrp 公共库：协议、配置、错误、工具与传输层抽象"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"   # 用本 crate 的 README（根 README 含相对路径，crates.io 上会破图）
keywords = ["frp", "proxy", "tunnel", "protocol", "nat"]
categories = ["network-programming"]

[features]
# NLink v1 扩展层。默认开启；`--no-default-features` 关掉后
# `Login` / `LoginResp` 里不会出现扩展字段，报文与 0.6.x 逐字节一致（零开销）。
default = ["nlink"]
nlink = []

[dependencies]
quinn = { workspace = true }
yamux = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
libc = { workspace = true }
socket2 = { workspace = true }
webpki-roots = { workspace = true }

aes-gcm = { workspace = true }
aes = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
hkdf = { workspace = true }
md-5 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

anyhow = { workspace = true }
bytes = { workspace = true }
snap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
# pprof-rs 依赖 perf 信号与 nix，只在桌面 Unix（Linux / macOS）可用。
# ★ Android 虽然同样是 `unix`，但 pprof-rs 在它上面**编译不过**
#   （`frame_pointer` 相关 cfg 没实现），所以必须显式排除，
#   否则 Android 包（aarch64 / x86_64）直接编不出来。
# Windows / Android 上 pprof_http 返回明确的 501，而不是让整个 crate 编译失败。
pprof = { workspace = true }
