# 一条命令把「服务端 + 一个演示客户端」跑起来：
#
#   docker compose up
#
# 真实使用时通常只需要 frps 那一段，把 frpc 删掉即可。

services:
  frps:
    build: .
    image: nfrp:latest
    command: ["-c", "/etc/nfrp/frps.toml"]
    ports:
      # 控制连接与数据端口
      - "17000:17000"
      # xtcp 打洞牵线（UDP，别漏了 /udp）
      - "17002:17002/udp"
      # 内置面板与 /metrics
      - "17500:17500"
    volumes:
      - ./assets/frps.toml:/etc/nfrp/frps.toml:ro
    restart: unless-stopped

  # 演示客户端。★ 注意 `assets/frpc.toml` 里默认有一条**启用**的代理：
  #   把本机 22 端口（SSH）通过 frps 暴露到 <server>:6000。
  # 跟着这份 compose 跑起来 = 你的 SSH 就在公网上了。
  # 不需要的话请把 `assets/frpc.toml` 里第 1 条 `[[proxies]]`（name = "ssh"）
  # 注释掉，或者整段删掉下面这个 service。
  frpc:
    build: .
    image: nfrp:latest
    entrypoint: ["/usr/local/bin/frpc"]
    command: ["-c", "/etc/nfrp/frpc.toml"]
    depends_on:
      - frps
    volumes:
      - ./assets/frpc.toml:/etc/nfrp/frpc.toml:ro
    restart: unless-stopped
    # 要访问宿主机上的服务时打开下面这行
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
