[package]
name = "nfrp-client"
description = "NFrp 客户端：注册代理、按需建立工作连接"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["frp", "proxy", "tunnel", "client", "nat"]
categories = ["network-programming"]

[[bin]]
name = "nfrp-client"
path = "src/main.rs"

[dependencies]
nfrp-common = { workspace = true }

# xtcp 真 P2P 用 QUIC 承载直连流量（打洞成功后不再经过服务端）
quinn = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true }
# store 落盘用 JSON（与配置同一套 serde，不引入新依赖）
serde = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 单元测试里构造面板下发的 ServerCmd（里面带 serde_json::Value）
serde_json = { workspace = true }
